<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizing Committee - PEERPURI CUP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* Base Styles & Animated Gradient Background (Matching Homepage) */
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #0f172a, #2e1065, #020617, #083344);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Continuous Colorful Text Gradient Animation */
        .animated-text-gradient {
            background: linear-gradient(
                to right, 
                #ff2a85, #ff7e5f, #feb47b, #86a8e7, #91eae4, #ff2a85
            );
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: textGradient 3s linear infinite;
        }

        @keyframes textGradient {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.05);
        }

        /* Glowing Border Colors for different cards */
        .card-glow-1:hover { border-color: rgba(232, 121, 249, 0.5); box-shadow: 0 10px 30px rgba(232, 121, 249, 0.2); }
        .card-glow-2:hover { border-color: rgba(56, 189, 248, 0.5); box-shadow: 0 10px 30px rgba(56, 189, 248, 0.2); }
        .card-glow-3:hover { border-color: rgba(52, 211, 153, 0.5); box-shadow: 0 10px 30px rgba(52, 211, 153, 0.2); }
        .card-glow-4:hover { border-color: rgba(250, 204, 21, 0.5); box-shadow: 0 10px 30px rgba(250, 204, 21, 0.2); }

        /* Floating Animation for Header elements */
        .float-anim {
            animation: float 4s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="p-4 md:p-8 relative">

    <!-- Decorative Background Elements -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[10%] left-[5%] w-64 h-64 bg-pink-500 rounded-full mix-blend-screen filter blur-[100px] opacity-30 animate-pulse"></div>
        <div class="absolute bottom-[10%] right-[5%] w-80 h-80 bg-blue-500 rounded-full mix-blend-screen filter blur-[120px] opacity-30 animate-pulse" style="animation-delay: 2s;"></div>
        <div class="absolute top-[50%] left-[50%] transform -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-purple-500 rounded-full mix-blend-screen filter blur-[150px] opacity-20 animate-pulse" style="animation-delay: 4s;"></div>
    </div>

    <!-- Back to Home Button -->
    <div class="w-full max-w-6xl mx-auto flex justify-start mb-6">
        <a href="index.html" class="group relative overflow-hidden rounded-full p-[2px] transition-transform duration-300 hover:scale-105 active:scale-95 inline-block">
            <span class="absolute inset-0 bg-gradient-to-r from-cyan-400 to-blue-600 rounded-full"></span>
            <div class="relative bg-slate-900 rounded-full px-6 py-2 flex items-center justify-center gap-2 transition-all duration-300 group-hover:bg-opacity-0">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span class="text-sm md:text-base font-bold text-white group-hover:text-white drop-shadow-md">Back to Home</span>
            </div>
        </a>
    </div>

    <main class="w-full max-w-6xl mx-auto flex flex-col items-center justify-center space-y-10 pb-12">
        
        <!-- Main Title -->
        <header class="float-anim text-center w-full">
            <h1 class="text-4xl md:text-6xl lg:text-7xl font-black uppercase tracking-wider mb-2 drop-shadow-2xl">
                <span class="animated-text-gradient">आयोजन कमेटी</span>
            </h1>
            <p class="text-xl md:text-3xl font-bold text-gray-200 tracking-wide mt-2">
                Organizing Committee <span class="inline-block animate-bounce ml-2 text-3xl md:text-4xl">🏏</span>
            </p>
        </header>

        <!-- Committees Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 w-full mt-8">

            <!-- Card 1: सीनियर आयोजन कमेटी -->
            <section class="glass-card card-glow-1 p-6 md:p-8 flex flex-col h-full">
                <h2 class="text-2xl md:text-3xl font-bold text-white mb-6 border-b border-fuchsia-500 pb-3 flex items-center gap-3">
                    <span class="text-fuchsia-400">👑</span> सीनियर आयोजन कमेटी
                </h2>
                <div class="flex flex-wrap gap-3" id="senior-committee">
                    <!-- Chips inserted by JS for cleaner formatting, keeping data intact -->
                </div>
            </section>

            <!-- Card 2: आयोजन कमेटी -->
            <section class="glass-card card-glow-2 p-6 md:p-8 flex flex-col h-full">
                <h2 class="text-2xl md:text-3xl font-bold text-white mb-6 border-b border-cyan-500 pb-3 flex items-center gap-3">
                    <span class="text-cyan-400">🎯</span> आयोजन कमेटी
                </h2>
                <div class="flex flex-wrap gap-3" id="main-committee">
                    <!-- Chips -->
                </div>
            </section>

            <!-- Card 3: सहयोगी -->
            <section class="glass-card card-glow-3 p-6 md:p-8 flex flex-col h-full lg:col-span-2">
                <h2 class="text-2xl md:text-3xl font-bold text-white mb-6 border-b border-emerald-500 pb-3 flex items-center gap-3">
                    <span class="text-emerald-400">🤝</span> सहयोगी
                </h2>
                <div class="flex flex-wrap gap-3 justify-center md:justify-start" id="supporters">
                    <!-- Chips -->
                </div>
            </section>

            <!-- Card 4: डिसीजन मेकर -->
            <section class="glass-card card-glow-4 p-6 md:p-8 flex flex-col h-full lg:col-span-2 md:w-3/4 mx-auto">
                <h2 class="text-2xl md:text-3xl font-bold text-white mb-6 border-b border-yellow-500 pb-3 flex items-center justify-center gap-3">
                    <span class="text-yellow-400">⚖️</span> डिसीजन मेकर
                </h2>
                <div class="flex flex-wrap gap-3 justify-center" id="decision-makers">
                    <!-- Chips -->
                </div>
            </section>

        </div>
    </main>

    <!-- Script to Generate Colorful Chips dynamically from the provided data -->
    <script>
        const colorGradients = [
            "bg-gradient-to-r from-pink-500 to-rose-500",
            "bg-gradient-to-r from-purple-500 to-indigo-500",
            "bg-gradient-to-r from-cyan-500 to-blue-500",
            "bg-gradient-to-r from-emerald-400 to-teal-500",
            "bg-gradient-to-r from-amber-500 to-orange-500",
            "bg-gradient-to-r from-fuchsia-500 to-purple-600",
            "bg-gradient-to-r from-blue-500 to-indigo-600"
        ];

        function createChips(names, containerId) {
            const container = document.getElementById(containerId);
            names.forEach((name, index) => {
                // Assign a rotating color gradient based on index
                const colorClass = colorGradients[index % colorGradients.length];
                
                const chip = document.createElement('span');
                chip.className = `inline-block px-4 py-2 rounded-full font-semibold text-sm md:text-base text-white shadow-lg transition-all duration-300 transform hover:-translate-y-1 hover:scale-110 hover:shadow-2xl cursor-default border border-white/20 ${colorClass}`;
                chip.innerText = name.trim();
                container.appendChild(chip);
            });
        }

        // Data directly from your requirements
        const seniorNames = [
            "मेजर सुमेर सिंह राठोड कानोड़", "बाला राम जी लेघा", "राजू जी सोनी", "राम लाल जी", 
            "देवी लाल पोटलिया", "मदन सिंह जी राजपुरोहित", "देवी लाल सोयल", "सवरूप सिंह", 
            "करना राम गोदारा", "मेघ सिंह राजपुरोहित"
        ];

        const mainNames = [
            "लाला राम गोदारा", "रमेश राजपुरोहित", "किशन पूरी जी", "देरावर सिंह सरपंच कानोड़", 
            "मालमसिंह", "रावत लेघा", "किशन लेघा", "भवानी सिंह", "जोगा राम लेघा", "माल सिंह", "प्रहलाद गोयल"
        ];

        const supporterNames = [
            "हमीर सिंह", "नरोतम जाजडा", "शेरा राम भड़िया", "नरपत जाजडा", "रावत जाजडा", 
            "रणवीर पोटलिया", "जसराज सोनी", "चुना राम", "भैर नाथ", "किशन भड़िया", 
            "भावेश भड़िया", "देव", "विरध सोयल", "सुरेश", "मोटा राम", "राम सिंह", 
            "खेराज राम पनावडा", "लीला राम पनावडा"
        ];

        const decisionMakers = [
            "मदन राजपुरोहित", "लाला राम", "रमेश राजपुरोहित", "माल सिंह", "जोगा राम"
        ];

        // Render chips
        createChips(seniorNames, 'senior-committee');
        createChips(mainNames, 'main-committee');
        createChips(supporterNames, 'supporters');
        createChips(decisionMakers, 'decision-makers');

    </script>
</body>
</html>
