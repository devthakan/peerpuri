<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEERPURI CUP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* Base Styles & Animated Gradient Background */
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #0f172a, #2e1065, #020617, #083344);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Continuous Colorful Text Gradient Animation */
        .animated-text-gradient {
            background: linear-gradient(
                to right, 
                #ff2a85, #ff7e5f, #feb47b, #86a8e7, #91eae4, #ff2a85
            );
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: textGradient 3s linear infinite;
        }

        @keyframes textGradient {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* Glowing Welcome Box */
        .glow-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.4), inset 0 0 15px rgba(14, 165, 233, 0.2);
            animation: pulseGlow 2.5s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { 
                box-shadow: 0 0 15px rgba(14, 165, 233, 0.3), inset 0 0 10px rgba(14, 165, 233, 0.1); 
            }
            100% { 
                box-shadow: 0 0 35px rgba(56, 189, 248, 0.7), inset 0 0 20px rgba(56, 189, 248, 0.4); 
            }
        }

        /* Floating Animation for Header elements */
        .float-anim {
            animation: float 4s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* Glowing Buttons Custom Shadow */
        .btn-glow-1:hover { box-shadow: 0 0 25px rgba(56, 189, 248, 0.8); }
        .btn-glow-2:hover { box-shadow: 0 0 25px rgba(232, 121, 249, 0.8); }
        .btn-glow-3:hover { box-shadow: 0 0 25px rgba(250, 204, 21, 0.8); }
        .btn-glow-4:hover { box-shadow: 0 0 25px rgba(52, 211, 153, 0.8); }

    </style>
</head>
<body class="p-6">

    <!-- Decorative Background Elements -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[10%] left-[10%] w-64 h-64 bg-pink-500 rounded-full mix-blend-screen filter blur-[100px] opacity-30 animate-pulse"></div>
        <div class="absolute bottom-[10%] right-[10%] w-80 h-80 bg-blue-500 rounded-full mix-blend-screen filter blur-[120px] opacity-30 animate-pulse" style="animation-delay: 2s;"></div>
    </div>

    <main class="w-full max-w-4xl mx-auto flex flex-col items-center justify-center text-center space-y-12 py-10">
        
        <!-- Main Title -->
        <header class="float-anim w-full">
            <h1 class="text-6xl md:text-7xl lg:text-8xl font-black uppercase tracking-wider mb-2">
                <span class="animated-text-gradient drop-shadow-2xl">PEERPURI CUP</span>
            </h1>
            <p class="text-xl md:text-2xl font-semibold text-gray-300 tracking-widest uppercase">The Ultimate Cricket Showdown 🏆</p>
        </header>

        <!-- Welcome Message Box -->
        <section class="glow-box w-full max-w-2xl mx-auto p-6 md:p-8 transform transition-transform duration-500 hover:scale-105 cursor-default">
            <h2 class="text-2xl md:text-4xl font-bold leading-relaxed text-white drop-shadow-md">
                पीरपुरी क्रिकेट टीम <br class="hidden md:block" />
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-500">
                    आप का स्वागत करती है 
                </span>
                <span class="inline-block animate-bounce text-3xl ml-2">🏏</span>
            </h2>
        </section>

        <!-- Navigation Buttons -->
        <nav class="w-full grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
            
            <!-- Button 1: Cricket Tournament -->
            <button onclick="console.log('Cricket Tournament Clicked')" class="group relative overflow-hidden rounded-full p-[3px] transition-transform duration-300 hover:scale-105 active:scale-95">
                <span class="absolute inset-0 bg-gradient-to-r from-cyan-400 to-blue-600 rounded-full"></span>
                <div class="relative bg-slate-900 rounded-full px-8 py-4 flex items-center justify-center gap-3 transition-all duration-300 group-hover:bg-opacity-0 btn-glow-1">
                    <span class="text-xl md:text-2xl font-bold text-white group-hover:text-white drop-shadow-md">Cricket Tournament</span>
                    <span class="text-2xl">🏆</span>
                </div>
            </button>

            <!-- Button 2: Peerpuri Team -->
            <button onclick="console.log('Peerpuri Team Clicked')" class="group relative overflow-hidden rounded-full p-[3px] transition-transform duration-300 hover:scale-105 active:scale-95">
                <span class="absolute inset-0 bg-gradient-to-r from-fuchsia-500 to-pink-600 rounded-full"></span>
                <div class="relative bg-slate-900 rounded-full px-8 py-4 flex items-center justify-center gap-3 transition-all duration-300 group-hover:bg-opacity-0 btn-glow-2">
                    <span class="text-xl md:text-2xl font-bold text-white group-hover:text-white drop-shadow-md">Peerpuri Team</span>
                    <span class="text-2xl">🏏</span>
                </div>
            </button>

            <!-- Button 3: Organizing Committee -->
            <button onclick="console.log('Organizing Committee Clicked')" class="group relative overflow-hidden rounded-full p-[3px] transition-transform duration-300 hover:scale-105 active:scale-95">

                <div class="relative bg-slate-900 rounded-full px-8 py-4 flex items-center justify-center gap-3 transition-all duration-300 group-hover:bg-opacity-0 btn-glow-3">
                    <span class="text-xl md:text-2xl font-bold text-white group-hover:text-white drop-shadow-md">Organizing Committee</span>
                    <span class="text-2xl">👥</span>
                </div>
            </button>

            <!-- Button 4: Register Now -->
            <button onclick="console.log('Register Now Clicked')" class="group relative overflow-hidden rounded-full p-[3px] transition-transform duration-300 hover:scale-105 active:scale-95">
                <span class="absolute inset-0 bg-gradient-to-r from-emerald-400 to-teal-600 rounded-full"></span>
                <div class="relative bg-slate-900 rounded-full px-8 py-4 flex items-center justify-center gap-3 transition-all duration-300 group-hover:bg-opacity-0 btn-glow-4">
                    <span class="text-xl md:text-2xl font-bold text-white group-hover:text-white drop-shadow-md">Register Now</span>
                    <span class="text-2xl">📝</span>
                </div>
            </button>

        </nav>

        <!-- Organizer Section (आयोजक) -->

            <h3 class="text-3xl font-bold text-white drop-shadow-lg tracking-wide border-b-2 border-cyan-500 pb-2">
                आयोजक
            </h3>
            <div class="w-full overflow-hidden rounded-2xl shadow-2xl border border-white/10 relative group">
                <!-- Glowing overlay effect on image -->
                <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent pointer-events-none"></div>
                <!-- Using raw github content link to load the image properly -->
                <img 
                    src="https://raw.githubusercontent.com/devthakan/peerpuri/4d345d109e245fa9c413d33ff030df249b142f5a/Peerpuri%20Club%20Kanod%20Cricket%20Team%20Poster.png" 
                    alt="Peerpuri Club Kanod Cricket Team Organizer" 
                    class="w-full h-auto object-cover transform transition-transform duration-700 hover:scale-105 pointer-events-none"
                    style="-webkit-user-drag: none;"
                />
            </div>
        </section>

        <!-- Social & Updates Section -->

            <h3 class="text-xl md:text-2xl font-bold text-gray-200 text-center">

            </h3>
            
            <div class="flex flex-col sm:flex-row gap-6 w-full justify-center">

                    <svg class="w-7 h-7 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.1.824zm-3.423-14.416c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm.029 18.88c-1.161 0-2.305-.292-3.318-.844l-3.677.964.984-3.584c-.607-1.052-.927-2.262-.926-3.503.005-5.914 4.819-10.728 10.741-10.728 2.87 0 5.568 1.12 7.595 3.151 2.028 2.032 3.146 4.73 3.146 7.604-.005 5.922-4.819 10.738-10.738 10.738z"/>

                    <svg class="w-7 h-7 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                    </svg>
                    Follow Insta
                </a>
            </div>
        </section>

        <!-- Footer Accent -->
        <footer class="mt-16 text-sm text-gray-400 font-medium tracking-wide">
            &copy; 2026 Peerpuri Cricket Team. Let's Play! ⚡
        </footer>
    </main>

</body>
</html>
