<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peerpuri Team - PEERPURI CUP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Base Styles & Animated Gradient Background (EXACT MATCH TO THEME) */
        body {
            margin: 0;
            font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif;
            background: linear-gradient(-45deg, #0f172a, #2e1065, #020617, #083344);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            min-height: 100vh;
            min-height: 100dvh; /* Fix for mobile browsers bottom bar clipping */
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Continuous Colorful Text Gradient Animation */
        .animated-text-gradient {
            background: linear-gradient(to right, #ff2a85, #ff7e5f, #feb47b, #86a8e7, #91eae4, #ff2a85);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: textGradient 3s linear infinite;
        }

        @keyframes textGradient {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* Glassmorphism Panel/Card Style */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        
        .glass-panel:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.05);
        }

        .welcome-glow {
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.3), inset 0 0 15px rgba(56, 189, 248, 0.1);
        }

        /* Floating Animation */
        .float-anim {
            animation: float 4s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* Glowing Button Custom Shadow Effects */
        .glow-btn-1:hover { box-shadow: 0 0 30px rgba(244, 63, 94, 0.8); }    /* Rose */
        .glow-btn-2:hover { box-shadow: 0 0 30px rgba(56, 189, 248, 0.8); }   /* Cyan */
        .glow-btn-3:hover { box-shadow: 0 0 30px rgba(52, 211, 153, 0.8); }   /* Emerald */
        .glow-btn-4:hover { box-shadow: 0 0 30px rgba(250, 204, 21, 0.8); }   /* Amber */
        .btn-glow-back:hover { box-shadow: 0 0 25px rgba(255, 255, 255, 0.6); }

    </style>
</head>
<body class="p-6 pb-24 md:p-12 relative w-full"> <!-- Added pb-24 to ensure bottom button doesn't cut off -->

    <!-- Decorative Background Elements (Glowing Orbs) -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[15%] left-[10%] w-72 h-72 bg-blue-600 rounded-full mix-blend-screen filter blur-[120px] opacity-20 animate-pulse"></div>
        <div class="absolute bottom-[20%] right-[10%] w-96 h-96 bg-fuchsia-600 rounded-full mix-blend-screen filter blur-[150px] opacity-20 animate-pulse" style="animation-delay: 2s;"></div>
        <div class="absolute top-[50%] left-[50%] transform -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-rose-500 rounded-full mix-blend-screen filter blur-[140px] opacity-10 animate-pulse" style="animation-delay: 4s;"></div>
    </div>

    <!-- Back to Home Button (Top Left) -->
    <div class="w-full max-w-5xl mx-auto flex justify-start mb-6 z-10 relative">
        <a href="index.html" class="group relative overflow-hidden rounded-full p-[2px] transition-transform duration-300 hover:scale-105 active:scale-95 inline-block">
            <span class="absolute inset-0 bg-gradient-to-r from-gray-300 to-gray-500 rounded-full"></span>
            <div class="relative bg-slate-900 rounded-full px-5 py-2 flex items-center justify-center gap-2 transition-all duration-300 group-hover:bg-opacity-0 btn-glow-back">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span class="text-sm md:text-base font-bold text-white drop-shadow-md">Back to Home</span>
            </div>
        </a>
    </div>

    <main class="w-full max-w-5xl mx-auto flex flex-col items-center justify-center space-y-12 relative z-10">
        
        <!-- Main Title -->
        <header class="float-anim text-center w-full mt-4">
            <h1 class="text-5xl md:text-7xl lg:text-8xl font-black uppercase tracking-wider mb-4 drop-shadow-2xl">
                <span class="animated-text-gradient">PEERPURI TEAM</span>
            </h1>
        </header>

        <!-- Welcome Box -->
        <section class="glass-panel welcome-glow w-full max-w-3xl mx-auto p-8 md:p-10 text-center">
            <h2 class="text-3xl md:text-4xl lg:text-5xl font-extrabold text-white drop-shadow-lg leading-tight">
                पीरपुरी क्रिकेट टीम में <br class="hidden md:block">
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 to-blue-500">आपका स्वागत है</span>
                <span class="inline-block animate-bounce ml-2">🏏</span>
            </h2>
            <p class="text-gray-300 mt-4 text-lg md:text-xl font-medium tracking-wide">Explore our team's legacy and members</p>
        </section>

        <!-- Action Buttons Grid -->
        <nav class="w-full max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6 lg:gap-8">
            
            <!-- 1. Team Win -->
            <a href="https://devthakan.github.io/peerpuri/KanodWin.html" class="action-btn group relative overflow-hidden rounded-2xl p-[3px] transition-transform duration-300 hover:-translate-y-2 active:scale-95 block">
                <span class="absolute inset-0 bg-gradient-to-r from-rose-400 to-red-600 rounded-2xl"></span>
                <div class="relative bg-slate-900 rounded-2xl px-6 py-8 flex flex-col items-center justify-center gap-4 transition-all duration-300 group-hover:bg-opacity-0 glow-btn-1 h-full">
                    <span class="text-5xl md:text-6xl mb-2 drop-shadow-md">🏆</span>
                    <span class="text-2xl md:text-3xl font-bold text-white drop-shadow-md">Team Win</span>
                </div>
            </a>

            <!-- 2. Team Members -->
            <a href="https://devthakan.github.io/peerpuri/TeamMembers.html" class="action-btn group relative overflow-hidden rounded-2xl p-[3px] transition-transform duration-300 hover:-translate-y-2 active:scale-95 block">
                <span class="absolute inset-0 bg-gradient-to-r from-cyan-400 to-blue-600 rounded-2xl"></span>
                <div class="relative bg-slate-900 rounded-2xl px-6 py-8 flex flex-col items-center justify-center gap-4 transition-all duration-300 group-hover:bg-opacity-0 glow-btn-2 h-full">
                    <span class="text-5xl md:text-6xl mb-2 drop-shadow-md">👥</span>
                    <span class="text-2xl md:text-3xl font-bold text-white drop-shadow-md">Team Members</span>
                </div>
            </a>

            <!-- 3. Win All Photos -->
            <a href="https://peerpuricup.weebly.com/win-kanod-photos.html" class="action-btn group relative overflow-hidden rounded-2xl p-[3px] transition-transform duration-300 hover:-translate-y-2 active:scale-95 block">
                <span class="absolute inset-0 bg-gradient-to-r from-emerald-400 to-teal-600 rounded-2xl"></span>
                <div class="relative bg-slate-900 rounded-2xl px-6 py-8 flex flex-col items-center justify-center gap-4 transition-all duration-300 group-hover:bg-opacity-0 glow-btn-3 h-full">
                    <span class="text-5xl md:text-6xl mb-2 drop-shadow-md">📸</span>
                    <span class="text-2xl md:text-3xl font-bold text-white drop-shadow-md">Win All Photos</span>
                </div>
            </a>

            <!-- 4. Player Photos -->
            <a href="https://peerpuricup.weebly.com/pleyer-profile.html" class="action-btn group relative overflow-hidden rounded-2xl p-[3px] transition-transform duration-300 hover:-translate-y-2 active:scale-95 block">
                <span class="absolute inset-0 bg-gradient-to-r from-amber-400 to-orange-600 rounded-2xl"></span>
                <div class="relative bg-slate-900 rounded-2xl px-6 py-8 flex flex-col items-center justify-center gap-4 transition-all duration-300 group-hover:bg-opacity-0 glow-btn-4 h-full">
                    <span class="text-5xl md:text-6xl mb-2 drop-shadow-md">🏏</span>
                    <span class="text-2xl md:text-3xl font-bold text-white drop-shadow-md">Player Photos</span>
                </div>
            </a>

        </nav>

        <!-- Bottom Back to Home Button -->
        <div class="w-full mt-12 mb-8 flex justify-center">
            <a href="index.html" class="group relative overflow-hidden rounded-full p-[2px] transition-transform duration-300 hover:scale-105 active:scale-95 inline-block">
                <span class="absolute inset-0 bg-gradient-to-r from-gray-400 to-gray-600 rounded-full"></span>
                <div class="relative bg-slate-900 rounded-full px-8 py-3 flex items-center justify-center gap-3 transition-all duration-300 group-hover:bg-opacity-0 btn-glow-back">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    <span class="text-lg font-bold text-white drop-shadow-md">Back to Home</span>
                </div>
            </a>
        </div>

    </main>

</body>
</html>
